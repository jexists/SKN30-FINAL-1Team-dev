.form-check-input[type=&quot;radio&quot;] {

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

}

.form-check-label {

.form-switch .form-check-input {

  height: 20px;
  border: 0;

  background: var(--muted);
  box-shadow: none;

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  box-shadow: var(--shadow-sm);

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

  const byName = new Map(entities.map(entity =&gt; [entity.name, entity]));

  const apiBody = root.querySelector(&#x27;#sl-api-body&#x27;);

  let selectedEntity = &#x27;team&#x27;;

  function escapeHtml(value) {
    return String(value)
      .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;)
      .replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;)
      .replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
      .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)
      .replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#039;&#x27;);
  }

  function fillSelect(select, entries, allLabel) {
    select.innerHTML = `&lt;option value=&quot;all&quot;&gt;${escapeHtml(allLabel)}&lt;/option&gt;` + entries
      .map(([value, label]) =&gt; `&lt;option value=&quot;${escapeHtml(value)}&quot;&gt;${escapeHtml(label)}&lt;/option&gt;`)
      .join(&#x27;&#x27;);
  }

  fillSelect(erdDomain, Object.entries(domains).map(([key, value]) =&gt; [key, value.label]), &#x27;전체 도메인&#x27;);
  fillSelect(apiDomain, Object.entries(apiDomains), &#x27;전체 도메인&#x27;);

  function entityMatches(entity) {
    const domainOk = erdDomain.value === &#x27;all&#x27; || entity.domain === erdDomain.value;
    const query = erdSearch.value.trim().toLocaleLowerCase(&#x27;ko&#x27;);
    const queryOk = !query || `${entity.name} ${domains[entity.domain].label} ${entity.desc} ${entity.fields.join(&#x27; &#x27;)}`.toLocaleLowerCase(&#x27;ko&#x27;).includes(query);
    return domainOk &amp;&amp; queryOk;
  }

  function renderEntityList() {
    const filtered = entities.filter(entityMatches);
    root.querySelector(&#x27;#sl-erd-count&#x27;).textContent = `${filtered.length} / ${entities.length}개 표시`;
    if (!filtered.length) {
      entityGroups.innerHTML = &#x27;&lt;p class=&quot;entity-empty&quot;&gt;조건에 맞는 테이블이 없습니다.&lt;/p&gt;&#x27;;
      return;
    }
    entityGroups.innerHTML = Object.entries(domains).map(([domainKey, domain]) =&gt; {
      const rows = filtered.filter(entity =&gt; entity.domain === domainKey);
      if (!rows.length) return &#x27;&#x27;;
      return `&lt;section class=&quot;entity-group&quot; aria-label=&quot;${escapeHtml(domain.label)}&quot;&gt;
        &lt;div class=&quot;domain-heading&quot;&gt;
          &lt;span class=&quot;domain-swatch&quot; style=&quot;background:${domain.color}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
          &lt;h3&gt;${escapeHtml(domain.label)} · ${rows.length}&lt;/h3&gt;
        &lt;/div&gt;
        ${rows.map(entity =&gt; `&lt;div class=&quot;entity-row&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost text-nowrap&quot; data-entity=&quot;${escapeHtml(entity.name)}&quot; aria-pressed=&quot;${entity.name === selectedEntity}&quot;&gt;${escapeHtml(entity.name)}&lt;/button&gt;
          &lt;p&gt;${escapeHtml(entity.desc)}&lt;/p&gt;
        &lt;/div&gt;`).join(&#x27;&#x27;)}
      &lt;/section&gt;`;
    }).join(&#x27;&#x27;);
  }

  function tableButton(name) {
    if (!byName.has(name)) return `&lt;code&gt;${escapeHtml(name)}&lt;/code&gt;`;
    return `&lt;button type=&quot;button&quot; class=&quot;relation-link&quot; data-entity=&quot;${escapeHtml(name)}&quot;&gt;${escapeHtml(name)}&lt;/button&gt;`;
  }

  function relationMarkup(relation, direction) {
    const other = direction === &#x27;out&#x27; ? relation.to : relation.from;
    const label = relation.required ? &#x27;필수 FK&#x27; : &#x27;선택 FK&#x27;;
    const path = direction === &#x27;out&#x27;
      ? `&lt;code&gt;${escapeHtml(relation.field)}&lt;/code&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;${tableButton(other)}&lt;code&gt;${escapeHtml(relation.target)}&lt;/code&gt;`
      : `${tableButton(other)}&lt;code&gt;${escapeHtml(relation.field)}&lt;/code&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;code&gt;${escapeHtml(relation.to)}.${escapeHtml(relation.target)}&lt;/code&gt;`;
    return `&lt;div class=&quot;relation-row&quot;&gt;
      &lt;div class=&quot;relation-main&quot;&gt;
        ${path}
        &lt;span class=&quot;viz-badge&quot;&gt;${label}&lt;/span&gt;
      &lt;/div&gt;
      ${relation.note ? `&lt;p class=&quot;text-small text-muted&quot;&gt;${escapeHtml(relation.note)}&lt;/p&gt;` : &#x27;&#x27;}
    &lt;/div&gt;`;
  }

  function renderEntityDetail() {
    const entity = byName.get(selectedEntity) || entities[0];
    const outgoing = relations.filter(relation =&gt; relation.from === entity.name);
    const incoming = relations.filter(relation =&gt; relation.to === entity.name &amp;&amp; relation.from !== entity.name);
    entityDetail.innerHTML = `&lt;div class=&quot;detail-head&quot;&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(domains[entity.domain].label)}&lt;/span&gt;
      &lt;h2&gt;${escapeHtml(entity.name)}&lt;/h2&gt;
      &lt;p class=&quot;detail-copy&quot;&gt;${escapeHtml(entity.desc)}&lt;/p&gt;
    &lt;/div&gt;
    &lt;section class=&quot;detail-section&quot;&gt;
      &lt;h3&gt;핵심 필드&lt;/h3&gt;
      &lt;div class=&quot;field-list&quot;&gt;${entity.fields.map(field =&gt; `&lt;code&gt;${escapeHtml(field)}&lt;/code&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;detail-section&quot;&gt;
      &lt;h3&gt;참조하는 부모 · ${outgoing.length}&lt;/h3&gt;
      ${outgoing.length ? outgoing.map(relation =&gt; relationMarkup(relation, &#x27;out&#x27;)).join(&#x27;&#x27;) : &#x27;&lt;p class=&quot;relation-empty&quot;&gt;참조하는 부모가 없습니다.&lt;/p&gt;&#x27;}
    &lt;/section&gt;
    &lt;section class=&quot;detail-section&quot;&gt;
      &lt;h3&gt;참조받는 자식 · ${incoming.length}&lt;/h3&gt;
      ${incoming.length ? incoming.map(relation =&gt; relationMarkup(relation, &#x27;in&#x27;)).join(&#x27;&#x27;) : &#x27;&lt;p class=&quot;relation-empty&quot;&gt;이 테이블을 참조하는 자식이 없습니다.&lt;/p&gt;&#x27;}
    &lt;/section&gt;`;
  }

  function renderApis() {
    const query = apiSearch.value.trim().toLocaleLowerCase(&#x27;ko&#x27;);
    const filtered = apis.filter(api =&gt; {
      const domainOk = apiDomain.value === &#x27;all&#x27; || api.d === apiDomain.value;
      const methodOk = apiMethod.value === &#x27;all&#x27; || api.m === apiMethod.value;
      const queryOk = !query || `${api.m} ${api.p} ${api.s} ${api.x} ${apiDomains[api.d]}`.toLocaleLowerCase(&#x27;ko&#x27;).includes(query);
      return domainOk &amp;&amp; methodOk &amp;&amp; queryOk;
    });
    root.querySelector(&#x27;#sl-api-count&#x27;).textContent = `${filtered.length} / ${apis.length}개 표시`;
    apiBody.innerHTML = filtered.length ? filtered.map(api =&gt; `&lt;tr&gt;
      &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code class=&quot;method-${api.m.toLowerCase()}&quot;&gt;${api.m}&lt;/code&gt;&lt;/td&gt;
      &lt;td&gt;&lt;code&gt;${escapeHtml(api.p)}&lt;/code&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;${escapeHtml(apiDomains[api.d])}&lt;/div&gt;&lt;/td&gt;
      &lt;td class=&quot;scope-text&quot;&gt;${escapeHtml(api.s)}&lt;/td&gt;
      &lt;td&gt;${escapeHtml(api.x)}&lt;/td&gt;
    &lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;4&quot;&gt;조건에 맞는 API가 없습니다.&lt;/td&gt;&lt;/tr&gt;&#x27;;
    apiMobile.innerHTML = filtered.length ? filtered.map(api =&gt; `&lt;article class=&quot;api-mobile-row&quot;&gt;
      &lt;div class=&quot;api-mobile-meta&quot;&gt;
        &lt;code class=&quot;method-${api.m.toLowerCase()}&quot;&gt;${api.m}&lt;/code&gt;
        &lt;span class=&quot;text-small scope-text&quot;&gt;${escapeHtml(api.s)}&lt;/span&gt;
      &lt;/div&gt;
      &lt;code class=&quot;api-mobile-path&quot;&gt;${escapeHtml(api.p)}&lt;/code&gt;
      &lt;p class=&quot;detail-copy&quot;&gt;${escapeHtml(api.x)}&lt;/p&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(apiDomains[api.d])}&lt;/span&gt;
    &lt;/article&gt;`).join(&#x27;&#x27;) : &#x27;&lt;p class=&quot;entity-empty&quot;&gt;조건에 맞는 API가 없습니다.&lt;/p&gt;&#x27;;
  }

  function setView(view) {
    const isErd = view === &#x27;erd&#x27;;
    root.querySelector(&#x27;#sl-erd-panel&#x27;).hidden = !isErd;
    root.querySelector(&#x27;#sl-api-panel&#x27;).hidden = isErd;
    const erdTab = root.querySelector(&#x27;#sl-tab-erd&#x27;);
    const apiTab = root.querySelector(&#x27;#sl-tab-api&#x27;);
    erdTab.setAttribute(&#x27;aria-pressed&#x27;, String(isErd));
    apiTab.setAttribute(&#x27;aria-pressed&#x27;, String(!isErd));
    erdTab.classList.toggle(&#x27;btn-primary&#x27;, isErd);
    apiTab.classList.toggle(&#x27;btn-primary&#x27;, !isErd);
  }

  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const tab = event.target.closest(&#x27;#sl-tab-erd, #sl-tab-api&#x27;);
    if (tab) {
      setView(tab.id === &#x27;sl-tab-erd&#x27; ? &#x27;erd&#x27; : &#x27;api&#x27;);
      return;
    }
    const entityButton = event.target.closest(&#x27;[data-entity]&#x27;);
    if (entityButton &amp;&amp; byName.has(entityButton.dataset.entity)) {
      selectedEntity = entityButton.dataset.entity;
      renderEntityList();
      renderEntityDetail();
    }
  });

  erdDomain.addEventListener(&#x27;change&#x27;, renderEntityList);
  erdSearch.addEventListener(&#x27;input&#x27;, renderEntityList);
  apiDomain.addEventListener(&#x27;change&#x27;, renderApis);
  apiMethod.addEventListener(&#x27;change&#x27;, renderApis);
  apiSearch.addEventListener(&#x27;input&#x27;, renderApis);

  if (relations.length !== 65 || entities.length !== 26 || apis.length !== 62) {
    root.querySelector(&#x27;footer&#x27;).classList.add(&#x27;text-destructive&#x27;);
    root.querySelector(&#x27;footer&#x27;).textContent = `데이터 검산 오류: tables=${entities.length}, fks=${relations.length}, apis=${apis.length}`;
  }

  renderEntityList();
  renderEntityDetail();
  renderApis();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
