<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesLuv Database ERD</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #fbfbfc;
  --border: #dfe3e8;
  --border-strong: #c3cad3;
  --text: #1b1f24;
  --text-dim: #626b76;
  --text-faint: #8b939d;
  --accent: #2f6fd0;
  --accent-soft: #e6effc;
  --edge: #b6bec8;
  --edge-hl: #2f6fd0;
  --shadow: 0 1px 2px rgba(16,20,26,.06), 0 6px 20px rgba(16,20,26,.08);
  --g-workspace: #4b7bec;
  --g-crm: #26a69a;
  --g-sales: #e08c2a;
  --g-content: #8e6ad4;
  --g-agent: #d3556f;
  --g-config: #7a8695;
  --g-external: #9aa3ad;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b;
    --panel: #1c2026;
    --panel-2: #232830;
    --border: #333a44;
    --border-strong: #4a535f;
    --text: #e6e9ed;
    --text-dim: #a3acb8;
    --text-faint: #78818d;
    --accent: #6ba4f0;
    --accent-soft: #1e2c40;
    --edge: #454e5a;
    --edge-hl: #6ba4f0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --g-workspace: #6b95f5;
    --g-crm: #45bfb2;
    --g-sales: #eba653;
    --g-content: #a98ae4;
    --g-agent: #e5798e;
    --g-config: #94a0af;
    --g-external: #8b949f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
        "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
  overflow: hidden;
}
code, .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas,
        "Liberation Mono", monospace; }

/* ------------------------------------------------------------------ header */
header {
  position: absolute; inset: 0 0 auto 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 650; letter-spacing: -.01em; }
.stat { color: var(--text-faint); font-size: 12px; }
.spacer { flex: 1 1 auto; }
.search {
  position: relative; display: flex; align-items: center;
}
.search input {
  width: 210px; padding: 6px 26px 6px 10px;
  border: 1px solid var(--border-strong); border-radius: 7px;
  background: var(--panel); color: var(--text); font: inherit;
}
.search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.search .count {
  position: absolute; right: 8px; font-size: 11px; color: var(--text-faint);
  pointer-events: none;
}
button {
  padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 7px;
  background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
}
button:hover { background: var(--panel-2); border-color: var(--accent); }
button:active { transform: translateY(1px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px; border-radius: 999px; cursor: pointer; user-select: none;
  border: 1px solid var(--border); background: var(--panel);
  font-size: 12px; color: var(--text-dim);
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { opacity: .42; }
.chip:hover { border-color: var(--border-strong); }

/* ------------------------------------------------------------------ canvas */
#canvas { position: absolute; inset: 0; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#svg.panning { cursor: grabbing; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.4px; }
.edge.self { stroke-dasharray: 3 3; }
#svg.focus .edge { opacity: .1; }
#svg.focus .edge.hl { opacity: 1; stroke: var(--edge-hl); stroke-width: 2.2px; }
#svg.searching .edge { opacity: .12; }

.node { cursor: pointer; }
.node rect.box {
  fill: var(--panel); stroke: var(--border-strong); stroke-width: 1px; rx: 9;
}
.node rect.stripe { rx: 2; }
.node .tname { font-size: 13px; font-weight: 640; fill: var(--text); }
.node .tdesc { font-size: 10.5px; fill: var(--text-dim); }
.node .tcnt  { font-size: 10px; fill: var(--text-faint); }
.node:hover rect.box { stroke: var(--accent); }
#svg.focus .node { opacity: .22; }
#svg.focus .node.sel, #svg.focus .node.adj { opacity: 1; }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.4px; }
.node.adj rect.box { stroke: var(--accent); stroke-width: 1.6px; }
#svg.searching .node { opacity: .18; }
#svg.searching .node.match { opacity: 1; }
#svg.searching .node.match rect.box { stroke: var(--accent); stroke-width: 2px; }
.node.hidden { display: none; }

/* ------------------------------------------------------------------ drawer */
#drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%);
  background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  transform: translateX(100%); transition: transform .16s ease;
  display: flex; flex-direction: column; z-index: 10;
}
#drawer.open { transform: none; }
.dhead {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 14px 12px; border-bottom: 1px solid var(--border);
}
.dhead h2 { margin: 0; font-size: 16px; font-weight: 660; }
.dhead .grp {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 5px;
  font-size: 11px; color: var(--text-dim);
}
.dhead .grp .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dhead p { margin: 7px 0 0; color: var(--text-dim); font-size: 12.5px; }
.dclose {
  margin-left: auto; padding: 3px 8px; line-height: 1.3; font-size: 15px;
}
.dbody { overflow: auto; padding: 0 14px 24px; }
.dbody h3 {
  margin: 18px 0 8px; font-size: 11px; font-weight: 660; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-faint);
}
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
td.c-name { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
td.c-type { color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 11px; white-space: nowrap; }
.tw { overflow-x: auto; }
.reltable td.c-type { white-space: normal; word-break: break-word; }
.reltable td:first-child { white-space: nowrap; }
.tag {
  display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 10px;
  font-weight: 600; margin-right: 3px; white-space: nowrap;
}
.tag.pk { background: var(--accent-soft); color: var(--accent); }
.tag.uq { background: color-mix(in srgb, var(--g-crm) 18%, transparent); color: var(--g-crm); }
.tag.fk { background: color-mix(in srgb, var(--g-sales) 18%, transparent); color: var(--g-sales); }
.tag.nn { background: color-mix(in srgb, var(--text-faint) 15%, transparent); color: var(--text-dim); }
.meta { color: var(--text-faint); font-size: 11px; }
.reltable a, .link {
  color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 600;
}
.reltable a:hover { text-decoration: underline; }
.card {
  border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px;
  margin-bottom: 6px; background: var(--panel-2);
}
.card .cname { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
.card .cdef {
  font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--text-dim);
  margin-top: 3px; word-break: break-word; white-space: pre-wrap;
}
.empty { color: var(--text-faint); font-size: 12px; }
.col {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
  padding: 7px 2px; border-bottom: 1px solid var(--border);
}
.col .cn {
  font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; font-weight: 600;
  word-break: break-all;
}
.col .ct {
  font-family: ui-monospace, Consolas, monospace; font-size: 11px;
  color: var(--text-dim); text-align: right; white-space: nowrap;
}
.col .cx { grid-column: 1 / -1; font-size: 11px; color: var(--text-faint); }
.col .cx .ref { font-family: ui-monospace, Consolas, monospace; }
.col .cd { grid-column: 1 / -1; font-size: 12px; color: var(--text-dim); }

/* ------------------------------------------------------------------ hint */
#hint {
  position: absolute; left: 14px; bottom: 12px; z-index: 4;
  font-size: 11px; color: var(--text-faint);
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  border: 1px solid var(--border); border-radius: 7px; padding: 5px 9px;
  pointer-events: none;
}
#hint b { color: var(--text-dim); font-weight: 600; }
@media (max-width: 720px) {
  .chips { display: none; }
  #hint { display: none; }
}
</style>
</head>

const tables = SCHEMA.tables;

// 인접 관계
const adj = new Map(tables.map(t => [t.name, new Set()]));
const edgesOf = new Map(tables.map(t => [t.name, []]));
relations.forEach((r, i) => {
  r._i = i;
  if (adj.has(r.from) && adj.has(r.to)) {
    adj.get(r.from).add(r.to);
    adj.get(r.to).add(r.from);
  }
  edgesOf.get(r.from)?.push(r);
  if (r.to !== r.from) edgesOf.get(r.to)?.push(r);
});

function autoLayout() {
  // 부모(참조 대상)를 왼쪽에 두는 레이어 배치
  const layer = new Map(tables.map(t => [t.name, 0]));
  const parents = new Map(tables.map(t => [t.name, []]));
  relations.forEach(r => {
    if (r.from !== r.to && byName.has(r.to)) parents.get(r.from).push(r.to);
  });
  for (let pass = 0; pass < tables.length; pass++) {
    let moved = false;
    for (const t of tables) {
      const ps = parents.get(t.name);
      if (!ps.length) continue;
      const want = Math.max(...ps.map(p => layer.get(p))) + 1;
      if (want > layer.get(t.name)) { layer.set(t.name, want); moved = true; }
    }
    if (!moved) break;
  }

  const cols = new Map();
  for (const t of tables) {
    const l = layer.get(t.name);
    if (!cols.has(l)) cols.set(l, []);
    cols.get(l).push(t);
  }

  // 한 열이 너무 길면 두 갈래로 나눈다
  const lanes = [];
  [...cols.keys()].sort((a, b) => a - b).forEach(l => {
    const list = cols.get(l).sort((a, b) =>
      a.group === b.group ? a.name.localeCompare(b.name)
                          : Object.keys(GROUPS).indexOf(a.group) - Object.keys(GROUPS).indexOf(b.group));
    const parts = list.length > 11 ? 2 : 1;
    const size = Math.ceil(list.length / parts);
    for (let p = 0; p < parts; p++) lanes.push(list.slice(p * size, (p + 1) * size));
  });

  const tallest = Math.max(...lanes.map(l => l.length));
  const height = tallest * (NODE_H + ROW_GAP);
  lanes.forEach((lane, i) => {
    const laneH = lane.length * (NODE_H + ROW_GAP);
    const top = (height - laneH) / 2;
    lane.forEach((t, j) => {
      pos.set(t.name, {
        x: i * (NODE_W + COL_GAP),
        y: top + j * (NODE_H + ROW_GAP),
      });
    });
  });
}

function loadPositions() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && typeof saved === "object") {
      for (const [k, v] of Object.entries(saved)) {
        if (pos.has(k) && v && typeof v.x === "number" && typeof v.y === "number") pos.set(k, v);
      }
    }
  } catch (e) { /* 저장소를 못 읽어도 기본 배치로 돈다 */ }
}
function savePositions() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.fromEntries(pos))); }
  catch (e) { /* 무시 */ }
}
function clearPositions() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* 무시 */ }
}

/* ------------------------------------------------------------------ 렌더 */
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

const nodeEls = new Map();
const edgeEls = [];

function renderNodes() {
  gNodes.textContent = "";
  nodeEls.clear();
  for (const t of tables) {
    const g = el("g", { class: "node", "data-name": t.name, tabindex: "0" });
    g.appendChild(el("rect", { class: "box", width: NODE_W, height: NODE_H }));
    g.appendChild(el("rect", {
      class: "stripe", x: 1, y: 10, width: 4, height: NODE_H - 20,
      fill: `var(--g-${t.group})`,
    }));
    g.appendChild(el("text", { class: "tname", x: 16, y: 24 }, t.name));
    g.appendChild(el("text", { class: "tdesc", x: 16, y: 41 }, clip(t.description, 30)));
    g.appendChild(el("text", { class: "tcnt", x: 16, y: 54 },
      `${t.columns.length} columns · ${t.group}`));
    g.appendChild(el("title", {}, `${t.name} — ${t.description}`));
    gNodes.appendChild(g);
    nodeEls.set(t.name, g);
  }
  placeNodes();
}

function placeNodes() {
  for (const [name, g] of nodeEls) {
    const p = pos.get(name);
    g.setAttribute("transform", `translate(${p.x},${p.y})`);
  }
}

function anchors(a, b) {
  // 두 사각형에서 가장 가까운 변의 중점을 잡는다
  const ac = { x: a.x + NODE_W / 2, y: a.y + NODE_H / 2 };
  const bc = { x: b.x + NODE_W / 2, y: b.y + NODE_H / 2 };
  const dx = bc.x - ac.x, dy = bc.y - ac.y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    const s = dx >= 0 ? 1 : -1;
    return [
      { x: ac.x + s * NODE_W / 2, y: ac.y, h: true, s },
      { x: bc.x - s * NODE_W / 2, y: bc.y, h: true, s: -s },
    ];
  }
  const s = dy >= 0 ? 1 : -1;
  return [
    { x: ac.x, y: ac.y + s * NODE_H / 2, h: false, s },
    { x: bc.x, y: bc.y - s * NODE_H / 2, h: false, s: -s },
  ];
}

function edgePath(r) {
  const a = pos.get(r.to), b = pos.get(r.from);   // 부모 → 자식
  if (!a || !b) return "";
  if (r.from === r.to) {
    const x = a.x + NODE_W, y = a.y + NODE_H / 2;
    return `M${x},${y - 10} C${x + 46},${y - 26} ${x + 46},${y + 26} ${x},${y + 10}`;
  }
  const [p, q] = anchors(a, b);
  if (p.h) {
    const m = (p.x + q.x) / 2;
    return `M${p.x},${p.y} C${m},${p.y} ${m},${q.y} ${q.x},${q.y}`;
  }
  const m = (p.y + q.y) / 2;
  return `M${p.x},${p.y} C${p.x},${m} ${q.x},${m} ${q.x},${q.y}`;
}

function setMarkers(p, r, hl) {
  const sfx = hl ? "-hl" : "";
  p.setAttribute("marker-start", `url(#m-one${sfx})`);
  p.setAttribute("marker-end", `url(#m-${r.type === "1:1" ? "one" : "many"}${sfx})`);
}

function renderEdges() {
  gEdges.textContent = "";
  edgeEls.length = 0;
  for (const r of relations) {
    if (!pos.has(r.from) || !pos.has(r.to)) continue;
    const p = el("path", {
      class: "edge" + (r.from === r.to ? " self" : ""),
      d: edgePath(r),
    });
    setMarkers(p, r, false);
    p.appendChild(el("title", {}, `${r.from}.${r.fromColumns.join(", ")} → ${r.to}.${r.toColumns.join(", ")} (${r.type})`));
    gEdges.appendChild(p);
    edgeEls.push({ r, el: p });
  }
}

function updateEdges() {
  for (const { r, el: p } of edgeEls) p.setAttribute("d", edgePath(r));
}

/* ------------------------------------------------------------- 확대·이동 */
function applyView() {
  gViewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}
function zoomAt(cx, cy, factor) {
  const k = Math.min(3, Math.max(0.15, view.k * factor));
  const f = k / view.k;
  view.x = cx - (cx - view.x) * f;
  view.y = cy - (cy - view.y) * f;
  view.k = k;
  applyView();
}
function fit() {
  const visible = tables.filter(t => !hiddenGroups.has(t.group));
  if (!visible.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const t of visible) {
    const p = pos.get(t.name);
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x + NODE_W); y1 = Math.max(y1, p.y + NODE_H);
  }
  const pad = 60, top = 58;
  const w = svg.clientWidth, h = svg.clientHeight - top;
  const k = Math.min(3, Math.max(0.15, Math.min(w / (x1 - x0 + pad * 2), h / (y1 - y0 + pad * 2))));
  view.k = k;
  view.x = (w - (x1 - x0) * k) / 2 - x0 * k;
  view.y = top + (h - (y1 - y0) * k) / 2 - y0 * k;
  applyView();
}
function centerOn(name) {
  const p = pos.get(name);
  if (!p) return;
  const free = svg.clientWidth - (drawer.classList.contains("open") ? drawer.offsetWidth : 0);
  view.x = free / 2 - (p.x + NODE_W / 2) * view.k;
  view.y = (svg.clientHeight + 58) / 2 - (p.y + NODE_H / 2) * view.k;
  applyView();
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

let drag = null;
svg.addEventListener("pointerdown", e => {
  const node = e.target.closest(".node");
  if (node) {
    drag = {
      kind: "node", name: node.dataset.name, moved: false,
      sx: e.clientX, sy: e.clientY, orig: { ...pos.get(node.dataset.name) },
    };
  } else {
    drag = { kind: "pan", sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    svg.classList.add("panning");
  }
  try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 포인터가 이미 놓인 경우 */ }
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.kind === "pan") {
    view.x = drag.ox + dx; view.y = drag.oy + dy;
    applyView();
  } else {
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    pos.set(drag.name, { x: drag.orig.x + dx / view.k, y: drag.orig.y + dy / view.k });
    nodeEls.get(drag.name).setAttribute("transform",
      `translate(${pos.get(drag.name).x},${pos.get(drag.name).y})`);
    updateEdges();
  }
});
svg.addEventListener("pointerup", e => {
  svg.classList.remove("panning");
  if (drag && drag.kind === "node") {
    if (drag.moved) savePositions();
    else select(drag.name);
  }
  drag = null;
  try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
});

/* ---------------------------------------------------------------- 선택 */
function select(name) {
  selected = name;
  const near = adj.get(name) || new Set();
  for (const [n, g] of nodeEls) {
    g.classList.toggle("sel", n === name);
    g.classList.toggle("adj", near.has(n));
  }
  for (const { r, el: p } of edgeEls) {
    const on = r.from === name || r.to === name;
    p.classList.toggle("hl", on);
    setMarkers(p, r, on);
  }
  svg.classList.add("focus");
  openDrawer(byName.get(name));
}
function deselect() {
  selected = null;
  svg.classList.remove("focus");
  for (const g of nodeEls.values()) g.classList.remove("sel", "adj");
  for (const { r, el: p } of edgeEls) { p.classList.remove("hl"); setMarkers(p, r, false); }
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
}

/* --------------------------------------------------------------- 드로어 */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k === "onclick") n.onclick = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function openDrawer(t) {
  document.getElementById("d-name").textContent = t.name;
  const grp = document.getElementById("d-group");
  grp.innerHTML = "";
  grp.style.setProperty("--c", `var(--g-${t.group})`);
  grp.append(h("span", { class: "dot" }), `${t.group} — ${GROUPS[t.group] || ""}`);
  document.getElementById("d-desc").textContent = t.description;

  const body = document.getElementById("d-body");
  body.textContent = "";

  // Columns
  body.append(h("h3", {}, `Columns (${t.columns.length})`));
  body.append(...t.columns.map(c => h("div", { class: "col" },
    h("div", { class: "cn" },
      c.name,
      c.pk ? h("span", { class: "tag pk", style: "margin-left:6px" }, "PK") : null,
      c.unique ? h("span", { class: "tag uq", style: "margin-left:4px" }, "UNIQUE") : null,
      c.fk ? h("span", { class: "tag fk", style: "margin-left:4px" }, "FK") : null),
    h("div", { class: "ct" },
      c.type,
      c.nullable ? null : h("span", { class: "tag nn", style: "margin-left:6px" }, "NOT NULL")),
    (c.fk || c.default)
      ? h("div", { class: "cx" },
          c.fk ? h("span", { class: "ref" }, "→ " + c.fk) : null,
          (c.fk && c.default) ? " · " : null,
          c.default ? h("span", { class: "ref" }, "기본값 " + c.default) : null)
      : null,
    h("div", { class: "cd" }, c.description))));

  // Relations
  const outs = relations.filter(r => r.from === t.name);
  const ins = relations.filter(r => r.to === t.name && r.from !== t.name);
  body.append(h("h3", {}, `Relations (${outs.length + ins.length})`));
  if (!outs.length && !ins.length) {
    body.append(h("div", { class: "empty" }, "연결된 외래 키가 없다."));
  } else {
    const relRow = (other, type, detail) => h("tr", {},
      h("td", {}, byName.has(other)
        ? h("a", { onclick: () => { select(other); centerOn(other); } }, other)
        : other),
      h("td", {}, type),
      h("td", { class: "c-type" }, detail));
    body.append(h("div", { class: "tw" }, h("table", { class: "reltable" },
      h("thead", {}, h("tr", {},
        h("th", {}, "상대 테이블"), h("th", {}, "관계"), h("th", {}, "FK"))),
      h("tbody", {},
        outs.map(r => relRow(r.to, r.type,
          `${t.name}.${r.fromColumns.join(", ")} → ${r.to}.${r.toColumns.join(", ")}`)),
        ins.map(r => relRow(r.from, r.type === "1:1" ? "1:1" : "1:N",
          `${r.from}.${r.fromColumns.join(", ")} → ${t.name}.${r.toColumns.join(", ")}`))))));
  }

  // Constraints / Indexes
  const cons = t.constraints.filter(c => c.kind !== "INDEX");
  const idx = t.constraints.filter(c => c.kind === "INDEX");
  if (cons.length) {
    body.append(h("h3", {}, `Constraints (${cons.length})`));
    body.append(...cons.map(c => h("div", { class: "card" },
      h("div", { class: "cname" }, `${c.kind} · ${c.name}`),
      h("div", { class: "cdef" }, c.detail))));
  }
  if (idx.length) {
    body.append(h("h3", {}, `Indexes (${idx.length})`));
    body.append(...idx.map(c => h("div", { class: "card" },
      h("div", { class: "cname" }, c.name),
      h("div", { class: "cdef" }, c.detail.split(" USING ").pop()))));
  }

  body.scrollTop = 0;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
}

document.getElementById("d-close").onclick = deselect;

/* ---------------------------------------------------------------- 검색 */
const q = document.getElementById("q");
const qcount = document.getElementById("qcount");
let matches = [];
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase();
  matches = [];
  if (!v) {
    svg.classList.remove("searching");
    for (const g of nodeEls.values()) g.classList.remove("match");
    qcount.textContent = "";
    return;
  }
  for (const t of tables) {
    const hit = t.name.toLowerCase().includes(v) || t.description.toLowerCase().includes(v);
    nodeEls.get(t.name).classList.toggle("match", hit);
    if (hit) matches.push(t.name);
  }
  svg.classList.add("searching");
  qcount.textContent = matches.length ? String(matches.length) : "0";
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && matches.length) {
    e.preventDefault();
    const name = matches[0];
    select(name);
    centerOn(name);
  }
  if (e.key === "Escape") { q.value = ""; q.dispatchEvent(new Event("input")); q.blur(); }
});

/* ------------------------------------------------------------ 그룹 필터 */
const chips = document.getElementById("chips");
for (const [key, label] of Object.entries(GROUPS)) {
  const n = tables.filter(t => t.group === key).length;
  if (!n) continue;
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", "true");
  b.style.setProperty("--c", `var(--g-${key})`);
  b.innerHTML = `<span class="dot"></span>${key} <span class="meta">${n}</span>`;
  b.title = label;
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    if (on) hiddenGroups.add(key); else hiddenGroups.delete(key);
    applyGroupFilter();
  };
  chips.appendChild(b);
}
function applyGroupFilter() {
  for (const t of tables) {
    nodeEls.get(t.name).classList.toggle("hidden", hiddenGroups.has(t.group));
  }
  for (const { r, el: p } of edgeEls) {
    const off = hiddenGroups.has(byName.get(r.from)?.group) || hiddenGroups.has(byName.get(r.to)?.group);
    p.style.display = off ? "none" : "";
  }
}

/* ---------------------------------------------------------------- 버튼 */
document.getElementById("btn-in").onclick = () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 1.25);
document.getElementById("btn-out").onclick = () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 1 / 1.25);
document.getElementById("btn-fit").onclick = fit;
document.getElementById("btn-layout").onclick = () => {
  autoLayout(); clearPositions(); placeNodes(); updateEdges(); fit();
};

document.addEventListener("keydown", e => {
  if (e.target === q) return;
  if (e.key === "Escape") deselect();
  if (e.key === "/") { e.preventDefault(); q.focus(); q.select(); }
  const step = 60;
  if (e.key === "ArrowLeft")  { view.x += step; applyView(); }
  if (e.key === "ArrowRight") { view.x -= step; applyView(); }
  if (e.key === "ArrowUp")    { view.y += step; applyView(); }
  if (e.key === "ArrowDown")  { view.y -= step; applyView(); }
  if (e.key === "0" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); fit(); }
});

/* ---------------------------------------------------------------- 시작 */
document.getElementById("stat").textContent =
  `${SCHEMA.tableCount}개 테이블 · ${SCHEMA.columnCount}개 컬럼 · 외래 키 ${SCHEMA.fkCount}개`;

autoLayout();
loadPositions();
renderNodes();
renderEdges();
applyGroupFilter();
fit();
window.addEventListener("resize", () => applyView());
</script>
</body>
</html>
