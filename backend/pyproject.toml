[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nh3>=0.3.1",
    "catboost==1.2.10",
    "deepagents==0.7.11",
    "joblib==1.5.3",
    "langchain-openai==1.6.0",
    # PaddleOCR/PaddleX currently requires NumPy < 2.4.
    "numpy==2.3.5",
    "pandas==3.0.5",
    "pydantic-settings>=2.14.2",
    "pypdf>=5.0.0",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.32",
    "scikit-learn==1.9.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
local = [
    "pdf-inspector>=1.17.0",
    "onnxruntime>=1.29.0",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "opencv-python-headless>=4.10.0",
    "pypdfium2>=5.13.0",
    "sentence-transformers>=6.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E,W: pycodestyle / F: pyflakes / I: isort / UP: pyupgrade / B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 외부 LLM 또는 Supabase 연결이 필요한 실통합 테스트",
]
