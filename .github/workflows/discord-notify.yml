name: Discord 알림

on:
  pull_request:
    types: [opened, closed]

  push:
    branches: [develop]

  issues:
    types: [opened]

  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Discord 알림 (새 PR → develop)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n \
            --arg title "🔀 새 PR이 생성됐어요 (→ develop)" \
            --arg url "$PR_URL" \
            --arg description "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg branch "\`$PR_HEAD\` → \`$PR_BASE\`" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 5814783,
                fields: [
                  { name: "작성자", value: $author, inline: true },
                  { name: "브랜치", value: $branch, inline: true }
                ]
              }]
            }' \
          | curl --fail-with-body --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-

  notify-main-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Discord 알림 (main 머지)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.merged_by.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n \
            --arg title "✅ main에 머지됐어요" \
            --arg url "$PR_URL" \
            --arg description "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg branch "\`$PR_HEAD\` → \`$PR_BASE\`" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 3066993,
                fields: [
                  { name: "머지한 사람", value: $author, inline: true },
                  { name: "브랜치", value: $branch, inline: true }
                ]
              }]
            }' \
          | curl --fail-with-body --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-

  notify-develop-push:
    if: github.event_name == 'push' && github.event.head_commit != null
    runs-on: ubuntu-latest

    steps:
      - name: Discord 알림 (develop 푸시)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PUSHER: ${{ github.actor }}
          COMPARE: ${{ github.event.compare }}
        run: |
          jq -n \
            --arg title "⬆️ develop에 푸시됐어요" \
            --arg url "$COMMIT_URL" \
            --arg description "$COMMIT_MSG" \
            --arg pusher "$PUSHER" \
            --arg compare "$COMPARE" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 15844367,
                fields: [
                  { name: "푸시한 사람", value: $pusher, inline: true },
                  { name: "변경 비교", value: $compare, inline: false }
                ]
              }]
            }' \
          | curl --fail-with-body --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-

  notify-issue-opened:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest

    steps:
      - name: Discord 알림 (새 Issue)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n \
            --arg title "📋 새로운 Issue가 생성됐어요" \
            --arg url "$ISSUE_URL" \
            --arg description "$ISSUE_TITLE" \
            --arg author "$ISSUE_AUTHOR" \
            --arg number "#$ISSUE_NUMBER" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 15158332,
                fields: [
                  { name: "작성자", value: $author, inline: true },
                  { name: "Issue", value: $number, inline: true }
                ]
              }]
            }' \
          | curl --fail-with-body --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-

  notify-issue-comment:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Discord 알림 (Issue 댓글)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          jq -n \
            --arg title "💬 Issue에 새로운 댓글이 달렸어요" \
            --arg url "$ISSUE_URL" \
            --arg description "$COMMENT_BODY" \
            --arg author "$ISSUE_AUTHOR" \
            --arg issue "#$ISSUE_NUMBER $ISSUE_TITLE" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: 3447003,
                fields: [
                  { name: "작성자", value: $author, inline: true },
                  { name: "Issue", value: $issue, inline: false }
                ]
              }]
            }' \
          | curl --fail-with-body --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
