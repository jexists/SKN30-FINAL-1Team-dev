<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>미팅 초안 회귀 테스트</title>
  </head>
  <body>
    <h1>미팅 초안 상태 회귀 테스트</h1>
    <p>
      로컬 Vite에서 /tests/meetingDraft.browser.html 열기. 실제 React 훅·작성 화면에 합성 입력과
      메모리 응답만 사용하며 서버 API를 호출하지 않습니다.
    </p>
    <pre id="result">실행 중…</pre>
    <div id="test-root"></div>
    <script type="module">
      import { act, createElement, Fragment } from 'react'
      import { createRoot } from 'react-dom/client'
      import { createMemoryRouter, RouterProvider } from 'react-router'
      import { client } from '../src/api/client.ts'
      import { SessionContext } from '../src/auth/sessionContext.ts'
      import ToastHost from '../src/components/Toast/ToastHost.tsx'
      import Compose from '../src/pages/Meetings/Compose.tsx'
      import { getMeetingGeneration } from '../src/pages/Meetings/meetingGenerationStore.ts'
      import useMeetingDraft from '../src/pages/Meetings/useMeetingDraft.ts'
      import { getToasts } from '../src/shared/toast.ts'

      window.IS_REACT_ACT_ENVIRONMENT = true
      const root = createRoot(document.getElementById('test-root'))
      const result = document.getElementById('result')
      const checks = []
      let draft
      function Probe({ item, report, ready }) {
        draft = useMeetingDraft(item, report, ready)
        return null
      }
      function assert(condition, message) {
        if (!condition) throw new Error(message)
        checks.push(message)
      }
      const item = { id: 'meeting-a', title: '합성 미팅', salesDealId: 'deal-a' }
      const template = {
        id: 'test-body',
        fields: [{ id: 'body', type: 'textarea', required: true, aiFilled: true }],
      }
      const savedSection = (id, body = '') => ({
        salesDealId: id,
        salesDeal: { id, label: id },
        product: `${id} 제품`,
        title: '서버 제목',
        values: { body },
        aiValues: {},
        analysisEvidence: {
          report_error: 'report_agent_review_limit',
          analysis_error: '이전 분석 실패',
        },
        reportError: 'report_agent_review_limit',
        analysisError: '이전 분석 실패',
      })
      const savedReport = {
        id: 'report-meeting-a',
        agendaId: item.id,
        template,
        apiStatus: 'draft',
        review: 'writing',
        title: '서버 공통 제목',
        transcript: '서버 원문',
        attachments: [],
        dealSections: ['deal-a', 'deal-b', 'deal-c'].map((id) => savedSection(id)),
      }
      async function render(nextItem, nextReport, ready) {
        await act(async () =>
          root.render(createElement(Probe, { item: nextItem, report: nextReport, ready })),
        )
      }
      async function checkComposeIsolation() {
        const container = document.getElementById('test-root')
        const composeRoot = createRoot(container)
        const adapter = client.defaults.adapter
        const pendingSaves = []
        const pendingReportSaves = []
        const unexpectedRequests = []
        const eventSources = []
        let appliedBackgroundRun = 0
        const NativeEventSource = window.EventSource
        window.EventSource = class {
          listeners = new Map()
          onerror = null
          constructor(url) {
            this.url = url
            eventSources.push(this)
          }
          addEventListener(type, listener) {
            this.listeners.set(type, listener)
          }
          close() {}
          emit(type, data) {
            this.listeners.get(type)?.({ data: JSON.stringify(data) })
          }
        }
        const response = (config, data) => ({
          config,
          data,
          status: 200,
          headers: {},
          statusText: 'OK',
        })
        const report = (id, body = `${id} 공통 메모`) => ({
          id: `report-${id}`,
          author_member_id: 'synthetic-owner',
          author_display_name: '합성 작성자',
          source_activity_id: id,
          sales_deal_id: null,
          report_date: '2026-08-31',
          status_code: 'draft',
          template_snapshot: template,
          transcript: `${id} 미팅 원문`,
          source_snapshot: id === 'meeting-b' ? {} : { meeting_run_id: `run-${id}` },
          content: {
            title: `${id} 보고서`,
            ...(id === 'meeting-b'
              ? {}
              : {
                  meeting_shared: {
                    run_id: `run-${id}`,
                    revision: body,
                    common_report: { body, evidence_ids: ['S0001'] },
                    unassigned_report: null,
                  },
                }),
          },
          deal_sections: [
            {
              sales_deal_id: `deal-${id}`,
              deal_snapshot: { id: `deal-${id}`, label: `딜 ${id}` },
              content: { product: `${id} 제품`, title: `${id} 딜 보고서`, values: { body: '' } },
              ai_evidence: null,
            },
          ],
        })
        const batchReport = {
          ...report('meeting-save-all'),
          id: 'report-meeting-save-all',
          source_activity_id: 'meeting-save-all',
          transcript: 'meeting-save-all 미팅 원문',
          source_snapshot: {},
          content: {
            title: 'meeting-save-all 합성 미팅',
          },
          deal_sections: ['A', 'B'].map((label) => ({
            sales_deal_id: `deal-${label}`,
            deal_snapshot: { id: `deal-${label}`, label: `딜 ${label}` },
            content: {
              product: `제품 ${label}`,
              title: `딜 ${label} 보고서`,
              values: { body: `딜 ${label} 본문` },
            },
            ai_evidence: null,
          })),
        }
        client.defaults.adapter = async (config) => {
          if (config.method === 'get' && config.url.startsWith('/activities/')) {
            const id = config.url.split('/').at(-1)
            return response(config, {
              id,
              title: `${id} 합성 미팅`,
              owner_member_id: 'synthetic-owner',
              owner_display_name: '합성 작성자',
              starts_at: '2026-08-31T09:00:00+09:00',
              ends_at: '2026-08-31T10:00:00+09:00',
              category_code: 'visit',
              customer_company_id: null,
              sales_deal_id: `deal-${id}`,
            })
          }
          if (config.method === 'get' && config.url === '/reports') {
            return response(config, {
              items:
                config.params.source_activity_id === 'meeting-save-all'
                  ? [batchReport]
                  : [report(config.params.source_activity_id)],
            })
          }
          if (config.method === 'patch' && config.url.endsWith('/meeting-notes')) {
            return new Promise((resolve, reject) => pendingSaves.push({ config, resolve, reject }))
          }
          if (config.method === 'patch' && config.url === '/reports/report-meeting-save-all') {
            return new Promise((resolve, reject) =>
              pendingReportSaves.push({ config, resolve, reject }),
            )
          }
          if (config.method === 'patch' && config.url === '/reports/report-meeting-background') {
            return response(config, report('meeting-background'))
          }
          if (
            config.method === 'post' &&
            config.url === '/reports/report-meeting-save-all/submit'
          ) {
            return response(config, { ...batchReport, status_code: 'submitted' })
          }
          if (config.method === 'post' && config.url === '/agent-runs') {
            return response(config, {
              id: 'run-background-agent',
              status_code: 'running',
              output_snapshot: null,
              evidence: null,
              error_message: null,
            })
          }
          if (config.method === 'post' && config.url === '/agent-runs/run-background-agent/apply') {
            appliedBackgroundRun += 1
            const completed = report('meeting-background')
            completed.source_snapshot = { meeting_run_id: 'run-background-agent' }
            completed.deal_sections[0].content.values = { body: '화면 밖에서 완성된 보고서' }
            return response(config, completed)
          }
          unexpectedRequests.push(config.url)
          throw new Error(`예상하지 않은 요청: ${config.url}`)
        }
        const session = {
          session: {
            memberId: 'synthetic-owner',
            role: 'member',
            profile: { name: '합성 작성자', title: '담당자' },
            isAdmin: false,
          },
          status: 'authenticated',
          login: async () => {},
          logout: async () => {},
        }
        const screen = (child) =>
          createElement(
            SessionContext,
            { value: session },
            createElement(Fragment, null, createElement(ToastHost), child),
          )
        const router = createMemoryRouter(
          [
            { path: '/meetings/new', element: screen(createElement(Compose)) },
            {
              path: '/away',
              element: screen(createElement('p', { id: 'away' }, '다른 업무 화면')),
            },
            {
              path: '/meetings/:reportId',
              element: screen(createElement('p', { id: 'detail' }, '미팅 보고서 상세')),
            },
          ],
          { initialEntries: ['/meetings/new?agenda=meeting-a'] },
        )
        const button = (text) =>
          [...container.querySelectorAll('button')].find((el) => el.textContent === text)
        const saveDraftButton = () =>
          container.querySelector('button[aria-label="미팅 보고서 임시저장"]')
        const submitButton = () => container.querySelector('button[aria-label="업무보고 확정"]')
        const notes = () => container.querySelector('[aria-label="미팅 공통·미지정 기록"] textarea')
        async function flush() {
          await act(async () => new Promise((resolve) => setTimeout(resolve, 0)))
        }
        async function navigate(id, suffix = '') {
          await act(async () => router.navigate(`/meetings/new?agenda=${id}${suffix}`))
          for (
            let at = 0;
            at < 20 && container.querySelector('#transcript')?.value !== `${id} 미팅 원문`;
            at += 1
          )
            await flush()
          assert(
            container.querySelector('#transcript')?.value === `${id} 미팅 원문`,
            `${id} 작성 화면 로드`,
          )
        }
        async function editNote(value) {
          await act(async () => {
            Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set.call(
              notes(),
              value,
            )
            notes().dispatchEvent(new Event('input', { bubbles: true }))
          })
        }
        async function saveNote() {
          await act(async () => button('공통·미지정 메모 저장').click())
        }
        try {
          await act(async () => composeRoot.render(createElement(RouterProvider, { router })))
          await navigate('meeting-a')
          await editNote('A 저장 전 수정')
          assert(
            button('미팅 전체 분석·보고서 작성').disabled,
            '수정한 공통 메모가 있으면 생성 잠금',
          )
          await navigate('meeting-a', '&view=unchanged')
          assert(notes().value === 'A 저장 전 수정', '같은 미팅의 다른 쿼리는 편집 상태 보존')
          await navigate('meeting-b')
          assert(
            !notes() && !button('미팅 전체 분석·보고서 작성').disabled,
            '미팅 전환 후 없는 공통 메모의 dirty 상태로 생성이 잠기지 않음',
          )

          await navigate('meeting-a')
          await editNote('A 늦은 저장')
          await saveNote()
          assert(pendingSaves.length === 1, '이전 미팅 저장 응답을 보류')
          await navigate('meeting-c')
          assert(!notes().disabled, '이전 미팅 저장 대기가 새 미팅 편집을 잠그지 않음')
          await editNote('C 저장할 메모')
          await saveNote()
          assert(
            pendingSaves.length === 2 && notes().disabled,
            '새 미팅 저장은 자체 대기 상태를 유지',
          )
          const toastCount = getToasts().length
          await act(async () =>
            pendingSaves[0].resolve(
              response(pendingSaves[0].config, report('meeting-a', 'A 늦은 응답')),
            ),
          )
          assert(
            notes().value === 'C 저장할 메모' && notes().disabled,
            '늦은 이전 성공 응답은 새 본문·저장 잠금을 바꾸지 않음',
          )
          assert(getToasts().length === toastCount, '화면을 떠난 저장의 성공 알림을 표시하지 않음')
          await act(async () =>
            pendingSaves[1].resolve(
              response(pendingSaves[1].config, report('meeting-c', 'C 저장 완료')),
            ),
          )
          assert(
            notes().value === 'C 저장 완료' && !notes().disabled,
            '현재 미팅 저장 응답은 정상 적용',
          )

          await navigate('meeting-a')
          await editNote('A 실패할 저장')
          await saveNote()
          await navigate('meeting-b')
          await act(async () => pendingSaves[2].reject(new Error('이전 미팅 저장 실패')))
          assert(
            !container.textContent.includes('이전 미팅 저장 실패') &&
              !button('미팅 전체 분석·보고서 작성').disabled,
            '이전 저장 실패도 새 미팅 오류·잠금 상태에 적용하지 않음',
          )

          await navigate('meeting-save-all')
          assert(
            !!saveDraftButton() &&
              !!submitButton() &&
              container.querySelectorAll('button[aria-label="미팅 보고서 임시저장"]').length === 1,
            '카드별 저장 없이 임시저장과 업무보고 확정을 한 곳에 표시',
          )
          await act(async () => saveDraftButton().click())
          const savedPayload =
            typeof pendingReportSaves[0]?.config.data === 'string'
              ? JSON.parse(pendingReportSaves[0].config.data)
              : pendingReportSaves[0]?.config.data
          assert(
            pendingReportSaves.length === 1 &&
              saveDraftButton().disabled &&
              submitButton().disabled &&
              saveDraftButton().textContent === '저장 중…' &&
              savedPayload.deal_sections.length === 2 &&
              savedPayload.deal_sections.every((section) => !('ai_evidence' in section)),
            '두 딜을 한 요청에 묶고 서버 소유 AI 필드를 제외한 채 재클릭 잠금',
          )
          await act(async () => {
            pendingReportSaves[0].resolve(response(pendingReportSaves[0].config, batchReport))
            await flush()
          })
          assert(
            router.state.location.pathname === '/meetings/new' && !!saveDraftButton(),
            '임시저장은 초안을 보존하고 작성 화면에 머묾',
          )
          await act(async () => submitButton().click())
          assert(pendingReportSaves.length === 2, '업무보고 확정도 미팅 단일 저장 요청 사용')
          await act(async () => {
            pendingReportSaves[1].resolve(response(pendingReportSaves[1].config, batchReport))
            await flush()
          })
          assert(
            router.state.location.pathname === '/meetings/report-meeting-save-all' &&
              !!container.querySelector('#detail'),
            '업무보고 확정이 끝난 뒤에만 미팅 보고서 단일 상세로 이동',
          )

          await navigate('meeting-background')
          await act(async () => button('미팅 전체 분석·보고서 작성').click())
          for (let at = 0; at < 20 && eventSources.length === 0; at += 1) await flush()
          assert(eventSources.length === 1, '백그라운드 미팅 실행이 시작됨')
          await act(async () => router.navigate('/away'))
          assert(!!container.querySelector('#away'), '보고서 작성 중 다른 화면으로 이동')
          await act(async () => {
            eventSources[0].emit('done', {
              id: 'run-background-agent',
              status_code: 'completed',
              output_snapshot: {
                reports: { deal_reports: [], common_report: null, unassigned_report: null },
                analyses: [],
                evidence: {},
                errors: {},
              },
              evidence: null,
              error_message: null,
            })
            await flush()
          })
          for (let at = 0; at < 20 && appliedBackgroundRun === 0; at += 1) await flush()
          const returnLink = [...container.querySelectorAll('a')].find(
            (link) => link.textContent === '초안 수정하기',
          )
          assert(
            appliedBackgroundRun === 1 &&
              returnLink?.getAttribute('href') === '/meetings/new?agenda=meeting-background',
            '화면 밖에서도 AI 초안을 적용하고 편집 화면 알림 표시',
          )
          await act(async () => returnLink.click())
          for (let at = 0; at < 20 && !container.querySelector('#transcript'); at += 1)
            await flush()
          assert(router.state.location.pathname === '/meetings/new', '완료 알림으로 초안 편집 복귀')
          assert(
            ![...container.querySelectorAll('a')].some(
              (link) => link.textContent === '초안 수정하기',
            ),
            '복귀하며 완료 알림 닫기',
          )
          assert(
            getMeetingGeneration('meeting-background') === null,
            '작성 화면이 반영한 AI 초안 완료 결과는 다시 적용하지 않도록 소비',
          )
          assert(unexpectedRequests.length === 0, '정의한 메모리 응답 외 서버 요청 없음')
        } finally {
          await act(async () => composeRoot.unmount())
          router.dispose()
          client.defaults.adapter = adapter
          window.EventSource = NativeEventSource
        }
      }
      async function run() {
        await render(item, undefined, false)
        assert(draft.salesDealIds.length === 0, '조회 전에는 빈 서버 응답으로 초기화하지 않음')
        await render(item, savedReport, true)
        assert(draft.salesDealIds.length === 3, '최초 조회 완료 후 선택 딜 3개 복원')
        await act(async () => {
          draft.setTranscript('사용자가 수정한 원문')
          draft.setTitle('deal-a', '직접 쓴 제목')
          draft.startManual('deal-a')
          draft.applyDocument('deal-a', { body: '사람이 쓴 본문' }, [])
          draft.beginGeneration(['deal-a', 'deal-b', 'deal-c'])
        })
        await act(async () => draft.bindReport(savedReport))
        await render({ ...item, title: '재조회된 일정 제목' }, { ...savedReport }, true)
        assert(
          Object.values(draft.draftsByDeal).every(
            (state) =>
              state.phase === 'generating' &&
              state.generationError === null &&
              state.analysisPhase === 'running',
          ),
          '사전저장 응답·재조회 뒤에도 딜 3개 생성/ML 진행 중 유지',
        )
        assert(
          draft.transcript === '사용자가 수정한 원문' &&
            draft.draftsByDeal['deal-a'].values.body === '사람이 쓴 본문' &&
            draft.draftsByDeal['deal-a'].title === '직접 쓴 제목',
          '재조회가 사용자 원문·제목·본문을 덮지 않음',
        )
        const progress = {
          run_id: 'run-current',
          status_code: 'running',
          stage: 'report_writing',
          previews: savedReport.dealSections.map((section) => ({
            section: 'deal',
            sales_deal_id: section.salesDealId,
            body: '검토 전 스트리밍 문장',
            revision: 1,
          })),
        }
        await act(async () => draft.receiveProgress(progress))
        await render(item, { ...savedReport, updatedAt: 'changed' }, true)
        assert(
          draft.processingProgress?.previews.length === 3 &&
            Object.values(draft.draftsByDeal).every((state) => state.phase === 'generating'),
          '스트리밍 수신 후 재조회에서도 미리보기와 카드 생성 상태 유지',
        )
        assert(
          draft.draftsByDeal['deal-a'].values.body === '사람이 쓴 본문' &&
            !Object.keys(draft.draftsByDeal['deal-b'].aiValues).length,
          '검토 전 문장은 최종 본문이나 AI 원본에 저장하지 않음',
        )
        await act(async () =>
          draft.generationFailed(['deal-a', 'deal-b', 'deal-c'], new Error('실행 실패')),
        )
        assert(
          draft.processingProgress === null &&
            draft.draftsByDeal['deal-a'].values.body === '사람이 쓴 본문',
          '실패 후 미리보기만 지우고 사람 본문 유지',
        )
        await act(async () => draft.beginGeneration(['deal-not-yet-saved']))
        assert(
          draft.salesDealIds.includes('deal-not-yet-saved') &&
            draft.draftsByDeal['deal-not-yet-saved'].phase === 'generating',
          '서버 조회 전인 선택 딜도 실행 스냅샷으로 복원',
        )
        await render(
          { id: 'meeting-b', title: '다른 미팅', salesDealId: 'deal-z' },
          undefined,
          true,
        )
        assert(
          draft.salesDealIds.join() === 'deal-z' && draft.transcript === '',
          '다른 미팅으로 이동하면 해당 미팅으로 새로 초기화',
        )
        await act(async () => root.unmount())
        await checkComposeIsolation()
        result.textContent = `PASS ${checks.length}\n${checks.join('\n')}`
        document.title = `PASS ${checks.length} · 미팅 초안 회귀 테스트`
      }
      run().catch((error) => {
        result.textContent = `FAIL\n${error.stack}`
        document.title = 'FAIL · 미팅 초안 회귀 테스트'
      })
    </script>
  </body>
</html>
