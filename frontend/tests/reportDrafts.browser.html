<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>보고서 출처·날짜 복구 회귀</title>
  </head>
  <body>
    <p>로컬 Vite에서 이 파일을 여세요. 실제 React 훅과 요청 변환을 합성 API 응답으로 검사합니다.</p>
    <pre id="result">실행 중…</pre>
    <div id="root"></div>
    <script type="module">
      import { act, createElement } from 'react'
      import { createRoot } from 'react-dom/client'
      import { AxiosError } from 'axios'
      import { MemoryRouter } from 'react-router'
      import { client } from '../src/api/client.ts'
      import { SessionContext } from '../src/auth/sessionContext.ts'
      import useDailyDraft from '../src/pages/Daily/useDailyDraft.ts'
      import useDailyReports from '../src/pages/Daily/useDailyReports.ts'
      import useMeetingDraft from '../src/pages/Meetings/useMeetingDraft.ts'
      import { meetingFinalizeRequestOf } from '../src/pages/Meetings/useMeetingReports.ts'
      import { toCreateRequest } from '../src/pages/Deals/useSalesDeals.ts'
      import MeetingCompose from '../src/pages/Meetings/Compose.tsx'

      window.IS_REACT_ACT_ENVIRONMENT = true
      const root = createRoot(document.getElementById('root'))
      const checks = []
      const check = (condition, label) => {
        if (!condition) throw new Error(label)
        checks.push(label)
      }
      const equal = (left, right, label) =>
        check(JSON.stringify(left) === JSON.stringify(right), label)
      const response = (config, data) => ({
        data,
        config,
        status: 200,
        statusText: 'OK',
        headers: {},
      })
      const page = (items) => ({ items, total: items.length, has_more: false, next_skip: null })
      const failure = (config, status) =>
        new AxiosError('합성 실패', 'ERR_BAD_RESPONSE', config, null, { status, data: {} })
      const report = (kind, id = 'child', submission = 'v1') => ({
        id,
        report_kind: kind,
        report_date: '2026-08-31',
        title: '합성 하위 보고서',
        author_member_id: 'author',
        author_display_name: '합성 작성자',
        status_code: 'submitted',
        current_submission_id: submission,
        version: 1,
        content: {},
        body: '합성 본문',
        attachments: [],
        deal_sections: [],
        updated_at: '2026-08-31T00:00:00Z',
      })
      const deal = (id, title, companyId = 'company-1', openedOn = '2026-08-20') => ({
        id,
        deal_no: `D-${id}`,
        title,
        customer_company_id: companyId,
        customer_company_name: '아크메드',
        customer_company_region_code: null,
        customer_company_business_no: null,
        customer_contact_id: 'contact-1',
        customer_contact_name: '김하나',
        product_id: 'product-1',
        product_name: '제품 A',
        deal_amount: 0,
        deal_type_code: 'new-business',
        deal_type_name: '신규 영업',
        source_code: null,
        owner_member_id: 'author',
        owner_display_name: '합성 작성자',
        opened_on: openedOn,
        memo: null,
        description: null,
        closed_on: null,
        sales_pipeline_id: 'pipeline-1',
        sales_pipeline_name: '기본 파이프라인',
        sales_pipeline_status_code: 'published',
        sales_pipeline_stage_id: 'stage-1',
        sales_pipeline_stage_code: 'new',
        sales_pipeline_stage_name: '신규',
        sales_pipeline_stage_tone: 'blue',
        sales_pipeline_stage_phase_code: 'in_progress',
        sales_pipeline_stage_position: 0,
        stage_position: 0,
        quote_no: null,
        quote_issued_on: null,
        quote_valid_until: null,
        contract_no: null,
        contract_signed_on: null,
        contract_ends_on: null,
        warranty_terms: null,
        expected_delivery_at: null,
        quote_status_id: null,
        quote_status_code: null,
        quote_status_name: null,
        quote_status_tone: null,
        contract_status_id: null,
        contract_status_code: null,
        contract_status_name: null,
        contract_status_tone: null,
        quote_amount: null,
        contract_amount: null,
        quote_delivery_terms: null,
        contract_payment_terms: null,
        contract_late_interest_terms: null,
        team_company_name: null,
        team_business_no: null,
        items: [],
        participants: [],
        order_status_code: null,
        order_status_name: null,
        order_status_tone: null,
        created_at: '2026-08-20T00:00:00Z',
        updated_at: '2026-08-20T00:00:00Z',
      })
      const session = {
        session: { memberId: 'author', role: 'member', profile: {}, isAdmin: false },
        status: 'authenticated',
      }
      let draft,
        reports,
        meeting,
        item = { id: 'agenda', title: '합성 미팅', date: '2026-09-02' }
      function Daily({ kind, date }) {
        draft = useDailyDraft(date, kind)
        reports = useDailyReports()
        return null
      }
      function Meeting() {
        meeting = useMeetingDraft(item)
        return null
      }
      const render = (element) =>
        act(async () =>
          root.render(createElement(SessionContext.Provider, { value: session }, element)),
        )
      const originalAdapter = client.defaults.adapter
      let relatedRequests = [],
        generated = [],
        finalized = [],
        latest,
        delayGeneration,
        rejectGeneration
      let children = [],
        failRelated = false,
        holdRelated = true,
        latestCalls = 0
      client.defaults.adapter = async (config) => {
        if (config.url === '/reports') {
          if (config.params.limit === 1) return response(config, page([]))
          if (holdRelated)
            return new Promise((resolve, reject) =>
              relatedRequests.push({ config, resolve, reject }),
            )
          if (failRelated) throw failure(config, 503)
          return response(config, page(children))
        }
        if (config.url === '/report-generations/latest') {
          latestCalls += 1
          if (!latest) throw failure(config, 404)
          return response(config, latest)
        }
        if (config.url === '/report-generations') {
          const input = JSON.parse(config.data)
          generated.push(input)
          return new Promise((resolve, reject) => {
            delayGeneration = () =>
              resolve(
                response(config, {
                  id: `run-${generated.length}`,
                  generation_input: input,
                  status_code: 'completed',
                  output_snapshot: { fields: [{ field_id: 'body', value: '합성 AI 본문' }] },
                }),
              )
            rejectGeneration = () => reject(failure(config, 503))
          })
        }
        if (config.url === '/reports/finalize') {
          const input = JSON.parse(config.data)
          finalized.push(input)
          return response(config, { ...report(input.report_kind, 'final'), ...input })
        }
        throw new Error(`허용하지 않은 합성 요청: ${config.method} ${config.url}`)
      }
      const flushRelated = () =>
        act(async () => {
          for (const request of relatedRequests.splice(0)) {
            request.resolve(response(request.config, page(children)))
          }
        })
      const reloadRelated = () => act(async () => draft.reloadRelated())
      const payload = (kind, date) => ({
        kind,
        date,
        approver: draft.approver,
        values: draft.values,
        activities: draft.activities,
        attachments: draft.attachments,
        transcript: draft.transcript,
      })

      async function run() {
        for (const [kind, childKind, date] of [
          ['일일', 'meeting', '2026-08-31'],
          ['주간', 'daily', '2026-08-30'],
          ['월간', 'weekly', '2026-09-01'],
        ]) {
          latest = undefined
          holdRelated = true
          failRelated = false
          children = [report(childKind)]
          await render(null)
          await render(createElement(Daily, { kind, date }))
          await act(async () => draft.setValue('body', '조회 중 수기 본문'))
          check(
            draft.relatedLoading && !draft.canGenerate && draft.missing.length > 0,
            `${kind}: 조회 지연 중 생성·제출 차단`,
          )
          const before = generated.length
          await act(async () => draft.generate())
          check(generated.length === before, `${kind}: 지연 중 POST 없음`)
          await flushRelated()
          check(
            draft.values.body === '조회 중 수기 본문' && draft.canGenerate,
            `${kind}: 첫 조회 후 수기 본문 보존`,
          )

          const overBody = '😀'.repeat(50_001)
          const beforeLimit = { generated: generated.length, finalized: finalized.length }
          await act(async () => draft.setValue('body', overBody))
          check(
            !draft.canGenerate &&
              draft.generationError.includes('50,000') &&
              draft.missing.some((reason) => reason.includes('50,000')),
            `${kind}: 초과 본문 생성·제출 차단과 이유 표시`,
          )
          await act(async () => {
            await draft.generate()
            try {
              await reports.submitReport(payload(kind, date))
            } catch {}
          })
          check(
            generated.length === beforeLimit.generated &&
              finalized.length === beforeLimit.finalized &&
              draft.values.body === overBody,
            `${kind}: 초과 HITL 본문 POST 0회·사용자 입력 보존`,
          )
          await act(async () => draft.setValue('body', ` ${'😀'.repeat(50_000)} `))
          check(
            draft.canGenerate && draft.missing.length === 0,
            `${kind}: trim 후 이모지 50,000자 본문 허용`,
          )
          await act(async () => draft.setValue('body', '조회 중 수기 본문'))

          let generation
          await act(async () => {
            generation = draft.generate()
            await Promise.resolve()
          })
          await act(async () => {
            rejectGeneration()
            await generation
          })
          check(
            draft.generationError &&
              !draft.generationRunId &&
              draft.values.body === '조회 중 수기 본문',
            `${kind}: 최초 생성 실패 시 run 없이 수기 본문 보존`,
          )
          children = [report(childKind, 'first-added'), report(childKind, 'child', 'refreshed')]
          await reloadRelated()
          await flushRelated()
          check(draft.activities.length === 2, `${kind}: 최초 생성 실패 후 조회된 목록 건수 갱신`)
          equal(
            draft.activities.map(({ refId, sourceSubmissionId }) => [refId, sourceSubmissionId]),
            [
              ['first-added', 'v1'],
              ['child', 'refreshed'],
            ],
            `${kind}: 최초 생성 실패 후 추가·변경된 제출본 목록 반영`,
          )
          check(
            !draft.sourceError && draft.missing.length === 0 && draft.canGenerate,
            `${kind}: 최초 생성 실패 후 제출본 변경을 잘못 차단하지 않음`,
          )
          const refreshedActivities = draft.activities
          await act(async () => {
            generation = draft.generate()
            await Promise.resolve()
          })
          const snapshot = generated.at(-1).content.activities
          equal(snapshot, refreshedActivities, `${kind}: 재시도 요청은 최신 조회 출처 사용`)
          children = [report(childKind, 'new'), ...children]
          await reloadRelated()
          await flushRelated()
          equal(draft.activities, snapshot, `${kind}: 생성 중 목록 추가에도 출처 동결`)
          await act(async () => {
            delayGeneration()
            await generation
          })
          await act(async () => draft.setValue('body', 'AI 생성 후 사용자 수정'))
          const recoveryCount = latestCalls
          await reloadRelated()
          await flushRelated()
          check(
            latestCalls === recoveryCount && draft.values.body === 'AI 생성 후 사용자 수정',
            `${kind}: 재조회로 복구 재실행·본문 초기화 없음`,
          )
          await act(async () => reports.submitReport(payload(kind, date), draft.generationRunId))
          equal(
            finalized.at(-1).content.activities,
            snapshot,
            `${kind}: 생성·최종 제출의 출처 일치`,
          )

          holdRelated = false
          failRelated = true
          await reloadRelated()
          check(
            !draft.canGenerate && draft.missing.length > 0 && draft.relatedError,
            `${kind}: 조회 실패 중 생성·제출 차단`,
          )
          check(draft.values.body === 'AI 생성 후 사용자 수정', `${kind}: 조회 실패에도 본문 보존`)
          failRelated = false
          children = [report(childKind, 'child', 'v2')]
          await reloadRelated()
          check(
            draft.canGenerate && draft.missing.length > 0 && draft.sourceError,
            `${kind}: 하위 제출본 변경 시 재생성 가능·제출 차단`,
          )
          equal(draft.activities, snapshot, `${kind}: 변경된 하위 제출본으로 몰래 교체하지 않음`)
          const priorRun = draft.generationRunId
          await act(async () => {
            generation = draft.generate()
            await Promise.resolve()
          })
          await act(async () => {
            rejectGeneration()
            await generation
          })
          equal(draft.activities, snapshot, `${kind}: 재생성 실패 시 이전 출처 복원`)
          check(
            draft.generationRunId === priorRun && draft.values.body === 'AI 생성 후 사용자 수정',
            `${kind}: 재생성 실패 시 이전 run·본문 보존`,
          )
          await act(async () => {
            generation = draft.generate()
            await Promise.resolve()
          })
          await act(async () => {
            delayGeneration()
            await generation
          })
          check(
            draft.missing.length === 0 && draft.activities[0].sourceSubmissionId === 'v2',
            `${kind}: 명시적 재생성 후 새 제출본 적용`,
          )

          const recoveryInput = {
            ...generated.at(-1),
            content: {
              ...generated.at(-1).content,
              activities: [
                ...generated.at(-1).content.activities,
                { id: 'excluded', source: '문서', refId: 'excluded', included: false },
              ],
            },
          }
          latest = {
            id: 'recovered-run',
            status_code: 'completed',
            generation_input: recoveryInput,
            output_snapshot: { fields: [{ field_id: 'body', value: '복구한 후보' }] },
          }
          holdRelated = true
          await render(null)
          await render(createElement(Daily, { kind, date }))
          check(
            draft.values.body === '복구한 후보' && !draft.canGenerate && draft.missing.length > 0,
            `${kind}: 복구는 지연된 조회 동안 후보만 보존`,
          )
          children = [report(childKind, 'added'), report(childKind, 'child', 'v2')]
          await flushRelated()
          equal(
            draft.activities,
            recoveryInput.content.activities,
            `${kind}: 복구 시 제외 항목까지 원래 참조 보존`,
          )
          check(draft.missing.length === 0, `${kind}: 추가 보고서는 복구 후보를 무효화하지 않음`)
          await act(async () => reports.submitReport(payload(kind, date), draft.generationRunId))
          equal(
            finalized.at(-1).content.activities,
            recoveryInput.content.activities,
            `${kind}: 복구·최초 확정 출처 일치`,
          )
          await act(async () => draft.setValue('body', '복구 후 수기 본문'))
          children = [report(childKind, 'child', 'v3')]
          await reloadRelated()
          await flushRelated()
          check(
            draft.missing.length > 0 && draft.values.body === '복구 후 수기 본문',
            `${kind}: 복구 후 제출본 변경도 본문 보존·제출 차단`,
          )
        }
        await render(null)
        await render(createElement(Meeting))
        await act(async () =>
          meeting.restoreGenerationInput({
            report_kind: 'meeting',
            report_date: '2026-08-31',
            source_activity_id: item.id,
            sales_deal_ids: [],
            transcript: '합성 원문',
            attachments: [],
            content: {},
          }),
        )
        item = { ...item, date: '2026-09-03' }
        await render(createElement(Meeting))
        check(
          meeting.reportDate === '2026-08-31',
          '미저장 AgentRun 복구 후 일정 이동에도 생성 당시 미팅일 보존',
        )
        const request = meetingFinalizeRequestOf(
          {
            agendaId: item.id,
            date: meeting.reportDate ?? item.date,
            time: '10:00',
            title: item.title,
            hospital: '',
            dept: '',
            contact: '',
            place: '',
            transcript: meeting.transcript,
            attachments: meeting.attachments,
            dealSections: [],
            commonBody: '합성 최종 본문',
          },
          'first-finalize',
          'recovered-meeting-run',
        )
        check(
          !request.report_id && request.report_date === '2026-08-31',
          '미저장 복구→일정 이동→최초 확정 report_date 보존',
        )
        item = { ...item, id: 'next-agenda', date: '2026-09-04' }
        await render(createElement(Meeting))
        check(meeting.reportDate === undefined, '다른 미팅으로 이동하면 이전 복구 날짜 초기화')

        await render(null)
        const finalCount = finalized.length
        const generationCount = generated.length
        client.defaults.adapter = async (config) => {
          if (config.url === '/activities/compose-agenda')
            return response(config, {
              id: 'compose-agenda',
              owner_member_id: 'author',
              owner_display_name: '합성 작성자',
              starts_at: '2026-08-31T01:00:00+00:00',
              title: '합성 미팅',
              category_code: 'meeting',
              completed_at: null,
              customer_company_id: null,
            })
          if (config.url === '/reports')
            return response(
              config,
              page([
                {
                  ...report('meeting', 'compose-report'),
                  source_activity_id: 'compose-agenda',
                  common_body: '공통 기록',
                  unassigned_body: '미지정 기록',
                  body: null,
                  direct_transcript: '직접 원문',
                  transcript: '직접 원문',
                },
              ]),
            )
          if (config.url === '/report-generations/latest') throw failure(config, 404)
          if (config.method === 'post') {
            if (config.url === '/reports/finalize') finalized.push(JSON.parse(config.data))
            if (config.url === '/report-generations') generated.push(JSON.parse(config.data))
          }
          throw new Error(`허용하지 않은 합성 요청: ${config.method} ${config.url}`)
        }
        await render(
          createElement(
            MemoryRouter,
            { initialEntries: ['/?agenda=compose-agenda'] },
            createElement(MeetingCompose),
          ),
        )
        const submit = document.querySelector('[aria-label="업무보고 작성 완료"]')
        check(submit && !submit.disabled, '실제 미팅 작성 화면: 유효 공통·미지정 본문 제출 가능')
        const setText = async (editor, value) =>
          act(async () => {
            Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set.call(
              editor,
              value,
            )
            editor.dispatchEvent(new Event('input', { bubbles: true }))
          })
        for (const label of ['공통 내용', '딜 미지정 · 확인 필요']) {
          const controlLabel = [...document.querySelectorAll('label')].find(
            (item) => item.textContent === label,
          )
          const editor = document.getElementById(controlLabel.htmlFor)
          await setText(editor, '😀'.repeat(50_001))
          check(
            submit.disabled &&
              [...document.querySelectorAll('[role="alert"]')].some((item) =>
                item.textContent.includes('50,000'),
              ),
            `${label}: 실제 HITL 버튼 비활성·초과 이유 표시`,
          )
          await act(async () => submit.click())
          check(
            finalized.length === finalCount && editor.value === '😀'.repeat(50_001),
            `${label}: 초과 입력 클릭도 POST 0회·본문 보존`,
          )
          await setText(editor, ` ${'😀'.repeat(50_000)} `)
          check(!submit.disabled, `${label}: trim 후 50,000자면 제출 재허용`)
          await setText(editor, label)
        }
        const transcriptEditor = document.getElementById('transcript')
        await setText(transcriptEditor, 'x'.repeat(50_001))
        const generateButton = [...document.querySelectorAll('button')].find(
          (button) => button.textContent === '미팅 전체 분석·보고서 작성',
        )
        check(
          generateButton.disabled && submit.disabled,
          '실제 미팅 화면: 직접 원문 초과는 생성·제출 버튼 모두 비활성',
        )
        await act(async () => {
          generateButton.click()
          submit.click()
        })
        check(
          generated.length === generationCount && finalized.length === finalCount,
          '실제 미팅 초과 원문은 생성·최종 제출 POST 0회',
        )

        // 미팅 보고서에서 새 딜을 여는 실제 흐름. 모든 요청은 이 합성 adapter 안에서만
        // 처리해 실제 영업·고객 데이터와 네트워크를 건드리지 않습니다.
        await render(null)
        const meetingDate = '2026-08-20'
        const defaultOpenedOnDate = new Date()
        defaultOpenedOnDate.setHours(0, 0, 0, 0)
        defaultOpenedOnDate.setDate(defaultOpenedOnDate.getDate() + 1)
        const expectedDefaultOpenedOn = new Intl.DateTimeFormat('en-CA').format(
          defaultOpenedOnDate,
        )
        const company = {
          id: 'company-1',
          name: '아크메드',
          address: null,
          business_no: null,
          region_code: null,
        }
        const contact = {
          id: 'contact-1',
          company_id: 'company-1',
          company_name: '아크메드',
          name: '김하나',
          department: '영업부',
          job_title: '팀장',
          email: null,
          phone: null,
        }
        const product = { id: 'product-1', name: '제품 A' }
        const initialReport = {
          ...report('meeting', 'saved-create-deal', 'saved-submission'),
          source_activity_id: 'create-deal-agenda',
          report_date: meetingDate,
          status_code: 'draft',
          title: '합성 미팅 보고서',
          content: {
            time: '09:30',
            hospital: company.name,
            dept: '영업부',
            contact: '김하나 팀장',
            place: '본사',
            title: '합성 미팅',
          },
          direct_transcript: '원문 보존 내용',
          transcript: '원문 보존 내용',
          common_body: '공통 편집 본문',
          unassigned_body: null,
          attachments: [
            {
              id: 'stored-source',
              kind: 'image',
              purpose: 'meeting_source',
              name: '원문.png',
              byte_size: 12,
              extract: '원문 첨부 보존',
              original_stored: true,
            },
          ],
          deal_sections: [],
        }
        let meetingDeals = []
        let dealListCalls = 0
        let createInputs = []
        let createShouldFail = true
        const pipeline = {
          id: 'pipeline-1',
          name: '기본 파이프라인',
          status_code: 'published',
          is_default: true,
        }
        const stage = {
          id: 'stage-1',
          name: '신규',
          code: 'new',
          tone: 'blue',
          outcome_code: 'in_progress',
          phase_code: 'in_progress',
          position: 0,
        }
        client.defaults.adapter = async (config) => {
          if (config.url === '/activities/create-deal-agenda')
            return response(config, {
              id: 'create-deal-agenda',
              owner_member_id: 'author',
              owner_display_name: '합성 작성자',
              starts_at: `${meetingDate}T00:30:00.000Z`,
              ends_at: `${meetingDate}T01:30:00.000Z`,
              title: '합성 미팅',
              category_code: 'meeting',
              completed_at: null,
              customer_company_id: company.id,
              customer_company_name: company.name,
              customer_contact_id: contact.id,
              customer_contact_name: contact.name,
              customer_contact_department: contact.department,
              customer_contact_job_title: contact.job_title,
              product_name: product.name,
              location: '본사',
              action_tag: 'meeting',
              note: '',
              all_day: false,
              briefing_queue_warning: null,
              schedule_conflict_warning: null,
              product_id: product.id,
              sales_deal_id: null,
            })
          if (config.url === '/reports') return response(config, page([initialReport]))
          if (config.url === '/report-generations/latest') throw failure(config, 404)
          if (config.url === '/sales-deals' && config.method === 'get') {
            dealListCalls += 1
            return response(config, page(meetingDeals))
          }
          if (config.url === `/customer-companies/${company.id}`)
            return response(config, company)
          if (config.url === '/sales-pipelines') return response(config, [pipeline])
          if (config.url === `/sales-pipelines/${pipeline.id}/stages`)
            return response(config, [stage])
          if (config.url === '/sales-deal-types')
            return response(config, [{ code: 'new-business', name: '신규 영업' }])
          if (config.url === '/products') return response(config, page([product]))
          if (config.url === '/customer-contacts') return response(config, page([contact]))
          if (config.url === '/sales-deals' && config.method === 'post') {
            const input = JSON.parse(config.data)
            createInputs.push(input)
            if (createShouldFail) throw failure(config, 403)
            const created = deal('created-deal', input.title ?? '아크메드 제품 A', company.id, input.opened_on)
            meetingDeals = [created]
            return response(config, created)
          }
          throw new Error(`허용하지 않은 새 딜 합성 요청: ${config.method} ${config.url}`)
        }
        await render(
          createElement(
            MemoryRouter,
            { initialEntries: ['/?agenda=create-deal-agenda'] },
            createElement(MeetingCompose),
          ),
        )
        await act(async () => {
          await Promise.resolve()
          await Promise.resolve()
        })
        const summaries = [...document.querySelectorAll('summary')]
        const dealsSummary = summaries.find((node) => node.textContent.includes('관련 딜 선택'))
        check(dealsSummary, '기존 딜 0건이어도 관련 딜 선택 영역이 표시됨')
        await act(async () => dealsSummary.click())
        const createDealButton = [...document.querySelectorAll('button')].find(
          (button) => button.textContent.trim() === '새 딜 생성',
        )
        check(createDealButton && !createDealButton.disabled, '새 딜 생성 버튼은 유효 상태에서 활성화됨')
        const commonEditor = () => {
          const label = [...document.querySelectorAll('label')].find(
            (item) => item.textContent.trim() === '공통 내용',
          )
          return label ? document.getElementById(label.htmlFor) : null
        }
        check(
          commonEditor()?.value === '공통 편집 본문' &&
            document.getElementById('transcript')?.value === '원문 보존 내용' &&
            document.body.textContent.includes('원문.png'),
          '새 딜을 열기 전 원문·첨부·공통 편집 본문이 존재함',
        )

        await act(async () => createDealButton.click())
        const loadingDialog = document.querySelector('[role="dialog"]')
        check(
          loadingDialog &&
            (loadingDialog.textContent.includes('새 딜 생성') ||
              loadingDialog.textContent.includes('영업 딜 추가')),
          '새 딜 선택지 조회 모달이 열림',
        )
        check(createDealButton.disabled, '새 딜 모달이 열린 동안 중복 열기 버튼을 잠금')
        const loadingCancel = [...loadingDialog.querySelectorAll('button')].find(
          (button) => button.textContent.trim() === '취소',
        )
        await act(async () => loadingCancel.click())
        check(
          createInputs.length === 0 &&
            document.getElementById('transcript')?.value === '원문 보존 내용' &&
            commonEditor()?.value === '공통 편집 본문' &&
            !document.body.textContent.includes('1건 선택'),
          '새 딜 취소 시 원문·첨부·공통 본문과 선택 상태 보존',
        )

        await act(async () => createDealButton.click())
        await act(async () => {
          await Promise.resolve()
          await Promise.resolve()
        })
        let dialog = document.querySelector('[role="dialog"]')
        check(dialog?.textContent.includes('영업 딜 추가'), '기존 SalesDealForm으로 새 딜 입력 모달을 엶')
        const companyInput = dialog.querySelector('input[aria-label="회사명"]')
        const contactInput = dialog.querySelector('input[aria-label="고객명"]')
        check(
          companyInput?.disabled && companyInput.value === company.name && contactInput?.disabled,
          '미팅 회사·고객이 프리필되고 두 입력이 잠김',
        )
        check(dialog.textContent.includes(contact.name), '프리필 고객 이름이 입력 모달에 표시됨')
        const closePreservingModal = [...dialog.querySelectorAll('button')].find(
          (button) => button.textContent.trim() === '취소',
        )
        await act(async () => closePreservingModal.click())
        check(
          createInputs.length === 0 &&
            document.getElementById('transcript')?.value === '원문 보존 내용' &&
            commonEditor()?.value === '공통 편집 본문',
          '입력 모달 취소도 편집 중인 원문과 공통 본문을 보존',
        )

        const fillDealForm = async () => {
          await act(async () => createDealButton.click())
          await act(async () => {
            await Promise.resolve()
            await Promise.resolve()
          })
          dialog = document.querySelector('[role="dialog"]')
          const productInput = dialog.querySelector('input[aria-label="제품"]')
          await act(async () => productInput.focus())
          await act(async () => {
            await Promise.resolve()
            await Promise.resolve()
          })
          const productOption = [...document.querySelectorAll('[role="option"]')].find((option) =>
            option.textContent.includes(product.name),
          )
          await act(async () => productOption.click())
          const titleLabel = [...dialog.querySelectorAll('label')].find(
            (label) => label.textContent.trim() === '제목',
          )
          const titleInput = titleLabel.querySelector('input')
          const inputSetter = Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            'value',
          ).set
          await act(async () => {
            inputSetter.call(titleInput, '미팅 신규 딜')
            titleInput.dispatchEvent(new Event('input', { bubbles: true }))
          })
        }
        await fillDealForm()
        await act(async () =>
          [...dialog.querySelectorAll('button')]
            .find((button) => button.textContent.trim() === '영업 딜 추가')
            .click(),
        )
        check(
          createInputs.length === 1 &&
            [...document.querySelectorAll('[role="alert"]')].some((item) =>
              item.textContent.includes('영업 딜을 등록할 권한이 없습니다.'),
            ),
          '403 딜 생성 API 실패가 일반 딜과 같은 한국어 권한 오류로 표시되고 POST 입력이 기록됨',
        )
        check(
          !document.body.textContent.includes('1건 선택'),
          '딜 생성 실패 시 선택 딜을 추가하지 않음',
        )

        createShouldFail = false
        await act(async () =>
          [...dialog.querySelectorAll('button')]
            .find((button) => button.textContent.trim() === '영업 딜 추가')
            .click(),
        )
        await act(async () => {
          await Promise.resolve()
          await Promise.resolve()
        })
        check(
          createInputs.length === 2 &&
            createInputs[1].customer_company_id === company.id &&
            createInputs[1].customer_contact_id === contact.id &&
            createInputs[1].opened_on === expectedDefaultOpenedOn &&
            createInputs[1].opened_on !== meetingDate &&
            createInputs[1].owner_member_id === undefined,
          `성공 POST 날짜 확인: opened_on=${createInputs[1]?.opened_on} expected=${expectedDefaultOpenedOn}`,
        )
        equal(
          createInputs[1],
          toCreateRequest(
            {
              customerCompanyId: company.id,
              customerContactId: contact.id,
              productId: product.id,
              title: '미팅 신규 딜',
              amount: 0,
              dealTypeCode: 'new-business',
              date: expectedDefaultOpenedOn,
              memo: null,
              sourceCode: null,
              stageId: stage.id,
              participantContactIds: [],
            },
            pipeline.id,
          ),
          '미팅 새 딜 입력은 일반 딜 생성 공통 payload 변환과 동일함',
        )
        check(
          document.body.textContent.includes('1건 선택') &&
            document.body.textContent.includes('미팅 신규 딜'),
          '생성 성공 딜을 즉시 선택하고 제목을 목록에 표시',
        )
        check(dealListCalls === 1, '생성 성공 후 기존 회사 딜 첫 목록을 재조회하지 않음')
        check(
          meetingDeals[0]?.id === 'created-deal' &&
            meetingDeals[0]?.customer_company_id === company.id &&
            meetingDeals[0]?.owner_member_id === 'author',
          '생성 응답의 회사·담당 영업자 정보가 목록에 보존됨',
        )
        document.getElementById('result').textContent =
          `PASS ${checks.length}\n${checks.join('\n')}`
      }
      run()
        .catch((error) => {
          document.getElementById('result').textContent = `FAIL\n${error.stack}`
        })
        .finally(async () => {
          await act(async () => root.unmount())
          client.defaults.adapter = originalAdapter
        })
    </script>
  </body>
</html>
