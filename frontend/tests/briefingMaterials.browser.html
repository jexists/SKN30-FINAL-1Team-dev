<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>브리핑 자료 화면 검증</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h, act } from 'react'
      import { createRoot } from 'react-dom/client'
      import { MemoryRouter } from 'react-router'
      import { SessionContext } from '../src/auth/sessionContext.ts'
      import { client } from '../src/api/client.ts'
      import RecordDrawer from '../src/pages/Dashboard/components/RecordDrawer/RecordDrawer.tsx'
      import '../src/styles/global.scss'

      window.IS_REACT_ACT_ENVIRONMENT = true
      const root = createRoot(document.getElementById('root'))
      const fixture = {
        run_id: 'run-1',
        status: 'completed',
        error: null,
        generated_at: '2026-09-12T15:00:00+09:00',
        content: {
          contract_summary:
            '합성병원 초음파 장비 납품 전 협의가 예정되어 있습니다.\n\n계약서에 따라 검수 후 대금을 지급합니다. 이번 미팅에서 설치 공간과 전원 준비 여부를 확인하세요.',
          source_refs: [{ type: 'document', id: 'contract' }],
          risks: [],
          recommended_actions: ['납품 전 설치 환경과 검수 일정을 확인하세요.'],
        },
        documents: {
          product: [
            {
              document_id: 'catalog',
              file_id: 'catalog-file',
              file_name: '초음파_진단기_제품설명서.pdf',
              summary_markdown: '제품의 주요 기능과 설치 환경을 설명합니다.',
            },
          ],
          related: [
            {
              document_id: 'contract',
              file_id: 'contract-file',
              file_name: '장비_납품_계약서.pdf',
              summary_markdown: '검수 완료 후 30일 이내 대금을 지급합니다.',
              excerpts: [
                {
                  content: '제4조 대금 지급: 검수 완료 후 30일 이내 대금을 지급합니다.',
                  page_start: 2,
                  page_end: 2,
                },
              ],
            },
            {
              document_id: 'catalog',
              file_id: 'catalog-file',
              file_name: '초음파_진단기_제품설명서.pdf',
              summary_markdown: null,
              excerpts: [
                {
                  content: '설치 전 전용 전원 및 장비 배치 공간을 확보해야 합니다.',
                  page_start: 4,
                  page_end: 4,
                },
              ],
            },
          ],
          search: { method: 'hybrid', status: 'completed' },
        },
      }
      let briefing = structuredClone(fixture)
      // 화면은 브리핑을 조회만 한다. /agent-runs 로 생성을 요청하면 여기서 걸린다.
      let unexpected = []
      client.defaults.adapter = async (config) => {
        let data
        if (config.url === '/activities/meeting-1') data = { ai_briefing: briefing }
        else if (config.url === '/reports' || config.url === '/orders')
          data = { items: [], total: 0, has_more: false }
        else if (config.url === '/sales-deals/deal-1')
          data = {
            id: 'deal-1',
            title: '초음파 장비 납품',
            deal_no: 'SL-DL-TEST',
            opened_on: '2026-09-12',
            deal_amount: 10000000,
            sales_pipeline_stage_name: '납품 협의',
            items: [],
            participants: [],
            sales_pipeline_stage_outcome_code: 'open',
            customer_company_name: '합성병원',
          }
        else {
          unexpected.push(config.url)
          throw new Error('Unexpected fixture request')
        }
        return { data, status: 200, statusText: 'OK', headers: {}, config }
      }
      const item = {
        id: 'meeting-1',
        title: '초음파 장비 납품 전 협의',
        hospital: '합성병원',
        contact: '합성 담당자',
        dept: '구매팀',
        product: '초음파 진단기',
        place: '회의실',
        date: '2026-09-12',
        time: '16:00',
        done: false,
        brief: '',
        owner: '테스트 영업',
        ownerMemberId: 'member-1',
        customerContactId: 'contact-1',
        salesDealId: 'deal-1',
        customerCompanyId: 'company-1',
      }
      const session = {
        status: 'authenticated',
        session: {
          memberId: 'member-1',
          role: 'member',
          isAdmin: false,
          profile: { name: '합성 담당자', title: '영업' },
        },
        login: async () => {},
        logout: async () => {},
      }
      let revision = 0
      async function render() {
        await act(async () =>
          root.render(
            h(
              SessionContext.Provider,
              { value: session },
              h(MemoryRouter, null, h(RecordDrawer, { key: revision++, item, onClose: () => {} })),
            ),
          ),
        )
      }
      const check = (condition, label) => {
        if (!condition) throw new Error(label)
      }
      // 갱신이 도는 중이면 본문이 타자 치듯 펴진다(BriefingStream). 다 쳐질 때까지 기다린
      // 뒤에 글을 본다 — 렌더 직후에는 첫 몇 글자만 서 있다.
      const waitFor = async (condition, label, timeout = 8000) => {
        const deadline = Date.now() + timeout
        while (!condition()) {
          if (Date.now() > deadline) throw new Error(`${label} (시간 초과)`)
          await act(async () => {
            await new Promise((resolve) => setTimeout(resolve, 60))
          })
        }
      }
      await render()
      const heading = [...document.querySelectorAll('h3')].find((el) =>
        el.textContent.startsWith('AI 브리핑'),
      )
      const briefingSection = heading.closest('section')
      const sourceSection = briefingSection.querySelector('[aria-label="브리핑 출처"]')
      check(sourceSection, '출처가 브리핑 내부에 있어야 함')
      // 'RAG 검색'은 제목 옆 InfoHint 설명에도 들어 있다. 출처 구획 안에서만 본다.
      check(sourceSection.textContent.includes('RAG 검색'), 'RAG 태그')

      // 출처는 끝에 한 번만, 중복 없이 선다. 픽스처의 제품설명서는 제품 자료와 관련 자료
      // 양쪽에 들어 있어, 묶음을 갈라 세우던 때는 같은 파일이 두 번 섰다.
      const sourceNames = [...sourceSection.querySelectorAll('li')].map((el) =>
        el.textContent.trim(),
      )
      check(sourceNames.length === 2, `출처 2건이어야 함: ${sourceNames.join(' / ')}`)
      check(new Set(sourceNames).size === sourceNames.length, '같은 자료가 두 번 서면 안 됨')
      check(
        sourceNames.some((name) => name.includes('제품설명서')),
        '제품 자료도 출처에 포함',
      )

      // 그 자료에서 온 문장에만 형광펜이 그어지고, 원문 링크는 그 문장 끝에 붙는다.
      const marks = [...briefingSection.querySelectorAll('mark')].filter((el) =>
        el.className.includes('cited'),
      )
      check(marks.length === 1, `인용 문장 1개여야 함: ${marks.length}`)
      check(marks[0].textContent.includes('대금을 지급합니다'), '인용 문장 위치')
      const mark = marks[0].querySelector('button')
      check(mark && mark.className.includes('citeMark'), '칠한 문장 끝에 원문 링크')
      check(mark.title.includes('페이지'), `링크 안내에 위치: ${mark.title}`)

      // 문단 앞에 파일 이름을 따로 세우지 않는다 — 형광펜과 같은 말을 두 번 하게 된다.
      const paragraph = marks[0].closest('p')
      check(
        !paragraph.textContent.includes('장비_납품_계약서.pdf'),
        '문단 안에 파일 이름이 다시 서면 안 됨',
      )
      check(paragraph.firstChild.nodeType === Node.TEXT_NODE, '문단은 본문 글자로 시작해야 함')
      check(
        !document.body.textContent.includes('관련 영업·발주를 불러오지 못했습니다'),
        '연결 딜 정상 표시',
      )
      // 고객사가 연결된 일정에서는 제목 옆에서 직접 다시 만들 수 있다.
      check(
        [...briefingSection.querySelectorAll('button')].some((el) =>
          el.textContent.includes('새로고침'),
        ),
        '브리핑 새로고침 버튼',
      )

      // 갱신이 도는 중에도 저장된 브리핑과 자료가 그대로 보여야 한다.
      briefing = structuredClone(fixture)
      briefing.refreshing = true
      await render()
      check(document.body.textContent.includes('최신 자료 반영 중'), '갱신 중 상태 표시')
      await waitFor(
        () => document.body.textContent.includes('설치 공간과 전원'),
        '갱신 중에도 본문 유지',
      )
      check(
        document.querySelectorAll('[aria-label="브리핑 출처"] li').length === 2,
        '갱신 중에도 출처 유지',
      )
      check(
        document.querySelector('[aria-label="브리핑 출처"]').textContent.includes('제품설명서'),
        '갱신 중에도 제품 자료 유지',
      )
      check(!document.body.textContent.includes('준비 중'), '기존 결과가 있으면 준비 중 아님')

      // 갱신에 실패해도 마지막 성공 브리핑은 남는다.
      briefing = structuredClone(fixture)
      briefing.refresh_error = 'llm_timeout'
      await render()
      check(document.body.textContent.includes('설치 공간과 전원'), '실패해도 이전 본문 유지')
      check(
        document.body.textContent.includes('최신 자료로 다시 만들지 못했습니다'),
        '갱신 실패 안내',
      )

      // 아직 한 번도 만들어진 적이 없을 때만 준비 중을 보여준다.
      briefing = {
        run_id: 'r',
        status: 'queued',
        content: null,
        error: null,
        generated_at: null,
        refreshing: true,
      }
      await render()
      // 아직 결과가 없으면 진행 줄만 선다. 문구는 몇 초마다 돌아가므로 줄이 있는지만 본다.
      check(document.querySelector('[aria-label="AI 브리핑 진행"]'), '최초 브리핑 진행 표시')

      briefing = structuredClone(fixture)
      briefing.documents = {
        related: [],
        product: [],
        search: { method: 'keyword', status: 'embedding_unavailable' },
      }
      await render()
      // 검색이 돌았는데 걸린 자료가 없을 뿐이면 "없습니다" 한 줄을 세우는 대신 구획을
      // 통째로 접는다. 의미 검색이 막혔다는 안내는 목록이 있을 때만 그 아래에 붙는다.
      check(!document.querySelector('[aria-label="브리핑 출처"]'), '빈 출처 구획은 접힘')
      check(!document.body.textContent.includes('제품설명서'), '이전 근거 잔존 없음')
      briefing.documents.search = { method: 'none', status: 'failed' }
      await render()
      check(
        !document.querySelector('[aria-label="브리핑 출처"]').textContent.includes('RAG 검색'),
        '검색 실패에 성공 배지 없음',
      )
      delete briefing.documents
      await render()
      check(document.body.textContent.includes('이전 브리핑입니다'), '기존 브리핑 호환')
      check(unexpected.length === 0, `예상 밖 API 호출: ${unexpected.join(', ')}`)
      briefing = structuredClone(fixture)
      await render()
      document.documentElement.dataset.testResult = 'passed'
      document.title = 'PASS · 브리핑 자료 화면 검증'
    </script>
  </body>
</html>
